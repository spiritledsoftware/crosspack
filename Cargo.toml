[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
version = "0.17.0"

[workspace.dependencies]
anyhow = "1.0"
assert_cmd = "2.2"
anstyle = "1.0"
clap = { version = "4.6", features = ["derive"] }
clap_complete = "4.6"
console = "0.16"
ed25519-dalek = "2.2"
hex = "0.4"
globset = "0.4"
indicatif = "0.18"
insta = "1.47"
pretty_assertions = "1.4"
semver = { version = "1.0", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
rexpect = "0.7"
sha2 = "0.11"
toml = "1.0"
